<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>saleis.live — Turn unsold stock into a branded sale, powered by AI</title>
    <meta
      name="description"
      content="Upload your stock. AI prepares the catalogue. Launch a branded sale in minutes — saleis.live never holds your money or your buyers' data."
    />

    <!-- Link-preview card (WhatsApp, Slack, iMessage, LinkedIn, etc.) — uses SALEIS.LIVE/assets/preview.png, copied in as public/images/og-preview.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saleis.live/" />
    <meta property="og:title" content="saleis.live — Stock in. Sale live." />
    <meta
      property="og:description"
      content="The AI-powered platform that turns unsold stock into a complete branded sale — in days, not months."
    />
    <meta property="og:image" content="https://saleis.live/images/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="saleis.live — Stock in. Sale live." />
    <meta
      name="twitter:description"
      content="The AI-powered platform that turns unsold stock into a complete branded sale — in days, not months."
    />
    <meta name="twitter:image" content="https://saleis.live/images/og-preview.jpg" />

    <style>
      /* Brand kit fonts, self-hosted from SALEIS.LIVE/assets/fonts & logotype — not a Google Fonts
         name-only reference, which silently falls back to a system font when unavailable. */
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-400.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-600.ttf") format("truetype");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("/fonts/instrument-serif-400.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      /* Marketing-site-only display face, per Ola's explicit scoping to this
         page's large headlines — admin/storefront keep Instrument Serif. */
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("/fonts/cormorant-garamond-variable.ttf") format("truetype-variations");
        font-weight: 300 700;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
