<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>saleis.live — Admin</title>

    <!-- PWA: installable, "Add to Home Screen" — see public/manifest.json and public/sw.js -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#173B8F" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="saleis.live" />

    <style>
      /* Global reset — without this, every fixed/min pixel width in the app
         (e.g. a 320px-min-width card with 28px padding) renders at its
         width PLUS its own padding/border, silently overflowing narrow
         viewports. Added 2026-08-20 after Ola found the whole admin app
         "rozjeżdża się" on mobile — most of that traced back to this
         missing reset, not individual per-page bugs. overflow-x:hidden is
         a safety net on top: even a spot we miss can't force the whole
         page to scroll sideways. */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { max-width: 100%; overflow-x: hidden; }
      body { margin: 0; }

      /* Brand kit fonts, self-hosted from SALEIS.LIVE/assets/fonts & logotype — not a Google Fonts
         name-only reference, which silently falls back to a system font when unavailable. */
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-400.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-600.ttf") format("truetype");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("/fonts/instrument-serif-400.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      /* Added 2026-08-18 — Launch Studio's Hero font picker previews each
         option in its own font, so these need to be loaded here too, not
         just on the storefront that actually uses the merchant's choice. */
      @font-face {
        font-family: "Playfair Display";
        src: url("/fonts/playfair-display-variable.ttf") format("truetype-variations");
        font-weight: 400 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Manrope";
        src: url("/fonts/manrope-variable.ttf") format("truetype-variations");
        font-weight: 200 800;
        font-display: swap;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/space-grotesk-variable.ttf") format("truetype-variations");
        font-weight: 300 700;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
